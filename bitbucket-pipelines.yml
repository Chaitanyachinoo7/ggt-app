            - aws configure set aws_secret_access_key "${AWS_SECRET}"
            - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-2.amazonaws.com
            - docker build -t ggt-api:qa .
            - docker tag ggt-api:qa 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:qa
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:qa
            - aws ecs update-service --region us-east-2 --cluster ggt-api-qa --service ggt-api-qa --force-new-deployment

    dev2:
      - step:
          name: DEV2 Deployment
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-dev2.yml app/ggt/configs/config.yml
