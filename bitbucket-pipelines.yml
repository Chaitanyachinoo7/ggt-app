    dev:
      - step:
          name: Development Deployment
          image: google/cloud-sdk:latest
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-dev.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-dev.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-dev.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-dev
            - gcloud builds submit --tag gcr.io/ggt-pfe-dev/ggt-pfe-services
            - gcloud beta run deploy ggt-pfe-services --image=gcr.io/ggt-pfe-dev/ggt-pfe-services --vpc-connector=vpc-connector-dev --vpc-egress=all --platform=managed  --allow-unauthenticated --region=us-central1

    qa:
