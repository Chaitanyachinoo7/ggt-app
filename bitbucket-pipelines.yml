image: python:3.7.2

pipelines:
  branches:
    master:
      - step:
          name: Production Deployemrnt
          image: google/cloud-sdk:latest
          deployment: production
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-prod
            - gcloud builds submit --tag gcr.io/ggt-pfe-prod/ggt-pfe-services
            - gcloud run deploy --image gcr.io/ggt-pfe-prod/ggt-pfe-services --platform managed  --allow-unauthenticated --region us-central1 ggt-pfe-services
            - gcloud run services update-traffic ggt-pfe-services --platform managed --to-latest
    dev:
      - step:
          name: Development Deployment
          image: google/cloud-sdk:latest
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-dev.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-dev.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-dev.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-dev
            - gcloud builds submit --tag gcr.io/ggt-pfe-dev/ggt-pfe-services
            - gcloud run deploy --image gcr.io/ggt-pfe-dev/ggt-pfe-services --platform managed  --allow-unauthenticated --region us-central1 ggt-pfe-services
    qa:
      - step:
          name: QA Deployment
          image: google/cloud-sdk:latest
          deployment: test
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-qa.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-qa.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-qa.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-qa
            - gcloud builds submit --tag gcr.io/ggt-pfe-qa/ggt-pfe-services
            - gcloud run deploy --image gcr.io/ggt-pfe-qa/ggt-pfe-services --platform managed  --allow-unauthenticated --region us-central1 ggt-pfe-services
    dev2:
      - step:
          name: DEV2 Deployment
          image: google/cloud-sdk:latest
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-dev2.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-dev2.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-dev2.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-dev2
            - gcloud builds submit --tag gcr.io/ggt-pfe-dev2/ggt-pfe-services
            - gcloud run deploy --image gcr.io/ggt-pfe-dev2/ggt-pfe-services --platform managed  --allow-unauthenticated --region us-central1 ggt-pfe-services
options:
  docker: true
