image: python:3.7.2

pipelines:
  branches:
    production-ops:
      - step:
          name: Ops Production Deployemrnt
          image: google/cloud-sdk:latest
          deployment: production-ops
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-prod
            - gcloud builds submit --tag gcr.io/ggt-pfe-prod/ggt-ops-services
            #            - gcloud run deploy --image gcr.io/ggt-pfe-prod/ggt-ops-services --platform managed  --allow-unauthenticated --region us-central1 ggt-ops-services
            - gcloud beta run deploy ggt-ops-services --image=gcr.io/ggt-pfe-prod/ggt-ops-services --vpc-connector=vpc-connector-prod  --vpc-egress=all --platform=managed  --allow-unauthenticated --region=us-central1
            - gcloud run services update-traffic ggt-ops-services --platform managed --region us-central1 --to-latest
    production-portal:
      - step:
          name: Portal Production Deployemrnt
          image: google/cloud-sdk:latest
          deployment: production-portal
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - gcloud auth activate-service-account --key-file app/ggt/configs/gcp-service-account.json
            - gcloud config set project ggt-pfe-prod
            - gcloud builds submit --tag gcr.io/ggt-pfe-prod/ggt-portal-services
            #            - gcloud run deploy --image gcr.io/ggt-pfe-prod/ggt-portal-services --platform managed  --allow-unauthenticated --region us-central1 ggt-portal-services
            - gcloud beta run deploy ggt-portal-services --image=gcr.io/ggt-pfe-prod/ggt-portal-services --vpc-connector=vpc-connector-prod  --vpc-egress=all --platform=managed  --allow-unauthenticated --region=us-central1
            - gcloud run services update-traffic ggt-portal-services --platform managed --region us-central1 --to-latest
    production-patient:
