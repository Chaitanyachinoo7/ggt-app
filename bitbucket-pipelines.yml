      - step:
          name: DEV2 Deployment
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-dev2.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-dev2.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-dev2.json app/ggt/configs/gcp-service-account.json
            - pip3 install awscli
            - aws configure set aws_access_key_id "${AWS_KEY}"
            - aws configure set aws_secret_access_key "${AWS_SECRET}"
            - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-2.amazonaws.com
            - docker build -t ggt-api:dev2 .
            - docker tag ggt-api:dev2 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:dev2
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:dev2
            - aws ecs update-service --region us-east-2 --cluster dev2-us-east-2-cluster --service dev2-us-east-2-service --force-new-deployment
            - docker build -t ggt-api-lambda:dev2 -f lambda/Dockerfile .
            - docker tag ggt-api-lambda:dev2 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api-lambda:dev2
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api-lambda:dev2

