          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - pip3 install awscli
            - aws configure set aws_access_key_id "${AWS_KEY}"
            - aws configure set aws_secret_access_key "${AWS_SECRET}"
            - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-2.amazonaws.com
            - docker build -t ggt-api:ops .
            - docker tag ggt-api:ops 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:ops
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:ops
            - aws ecs update-service --region us-west-2 --cluster ops-prod-us-west-2-cluster --service ops-prod-us-west-2-service --force-new-deployment
            - #aws ecs update-service --region us-east-2 --cluster ggt-api --service ggt-api-ops --force-new-deployment



options:
  docker: true
