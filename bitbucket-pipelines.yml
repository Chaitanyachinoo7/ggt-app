    production-aws:
      - step:
          name: Patient AWS Fargate Deployemrnt
          services:
            - docker
          caches:
            - pip
          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - pip3 install awscli
            - aws configure set aws_access_key_id "${AWS_KEY}"
            - aws configure set aws_secret_access_key "${AWS_SECRET}"
            - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-1.amazonaws.com
            - docker build -t ggt-api .
            - docker tag ggt-api:latest 135292740376.dkr.ecr.us-east-1.amazonaws.com/ggt-api:latest
            - docker push 135292740376.dkr.ecr.us-east-1.amazonaws.com/ggt-api:latest
            - aws ecs update-service --region us-east-1 --cluster ggt-api --service ggt-api-5 --force-new-deployment

