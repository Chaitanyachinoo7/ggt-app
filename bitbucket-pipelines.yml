            - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-2.amazonaws.com
            - docker build -t ggt-api:dev2 .
            - docker tag ggt-api:dev2 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:dev2
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:dev2
            - aws ecs update-service --region us-east-2 --cluster ggt-api-dev --service ggt-api-dev2 --force-new-deployment

    production-portal:
      - step:
          name: PROD PORTAL Deployment
          deployment: staging
          caches:
            - docker
          script:
            - cp app/ggt/configs/config-prod.yml app/ggt/configs/config.yml
            - cp app/ggt/configs/log-config-prod.yml app/ggt/configs/log-config.yml
            - cp app/ggt/configs/gcp-service-account-prod.json app/ggt/configs/gcp-service-account.json
            - pip3 install awscli
            - aws configure set aws_access_key_id "${AWS_KEY}"
            - aws configure set aws_secret_access_key "${AWS_SECRET}"
            - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 135292740376.dkr.ecr.us-east-2.amazonaws.com
            - docker build -t ggt-api:portal .
            - docker tag ggt-api:portal 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:portal
            - docker push 135292740376.dkr.ecr.us-east-2.amazonaws.com/ggt-api:portal
            - #aws ecs update-service --region us-east-2 --cluster ggt-api --service ggt-api-portal --force-new-deployment
            - aws ecs update-service --region us-west-2 --cluster portal-prod-us-west-2-cluster --service portal-prod-us-west-2-service --force-new-deployment

    production-ops:
      - step:
          name: PROD OPS Deployment
          deployment: staging
          caches:
