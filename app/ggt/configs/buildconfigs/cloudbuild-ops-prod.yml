steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull gcr.io/ggt-ops-prod/ggt-ops-services:latest || exit 0']
- name: 'gcr.io/cloud-builders/docker'
  args: [
            'build',
            '-t', 'gcr.io/ggt-ops-prod/ggt-ops-services:latest',
            '--cache-from', 'gcr.io/ggt-ops-prod/ggt-ops-services:latest',
            '.'
        ]
images: ['gcr.io/ggt-ops-prod/ggt-ops-services:latest']